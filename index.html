<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolo English</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f59e0b"><link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8e7;--card:#fff;--ink:#2b2b2b;--accent:#16a34a;--blue:#2563eb;--bad:#dc2626;--line:#f1d98a;--ok:#bbf7d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a14;--card:#2a281f;--ink:#f5f0dc;--accent:#22c55e;--blue:#60a5fa;--bad:#f87171;--line:#4a4528;--ok:#14532d}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:14px;min-height:100%;box-sizing:border-box}
.big{font-size:2.2rem;border:0;border-radius:28px;padding:26px 10px;color:#fff;font-weight:700;width:100%;cursor:pointer;font-family:inherit;margin-bottom:14px}
.big small{display:block;font-size:1.3rem;font-weight:600;margin-top:6px}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px}
.pic{font-size:min(38vw,170px);line-height:1.2}
.word{font-size:2.6rem;font-weight:800;margin:6px 0;direction:ltr}
.row{display:flex;gap:12px;justify-content:center;margin-top:12px}
.ic{font-size:2.6rem;border:0;border-radius:50%;width:84px;height:84px;cursor:pointer;background:var(--blue);color:#fff}
.ic.h{background:#888;width:60px;height:60px;font-size:1.8rem}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ch{font-size:min(17vw,80px);background:var(--card);border:4px solid var(--line);border-radius:24px;padding:14px 0;cursor:pointer}
.ch.ok{border-color:var(--accent);background:var(--ok)}
.ch.no{border-color:var(--bad);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;font-size:1.8rem;margin-bottom:12px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:4px solid var(--line);border-radius:26px;padding:18px 6px;font-size:1.6rem;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.cat span{display:block;font-size:4.2rem;line-height:1.2}
.credit{margin-top:30px;font-size:.95rem;opacity:.7;direction:ltr}
.ph{display:block;margin:0 auto;border-radius:18px;object-fit:cover}.ph[hidden]{display:none}.pic .ph{width:min(70vw,280px);height:min(70vw,280px)}.ch .ph{width:90%;aspect-ratio:1/1}
.hide{display:none!important}
</style></head><body>
<div id="app">
 <div id="cover">
  
  <div class="pic" style="font-size:110px">🗣️</div>
  <h1 style="margin:0 0 8px;font-size:2.6rem">Bolo English</h1>
  <p style="font-size:1.4rem;margin:0 0 26px">Listen, look and speak English</p>
  <button class="big" style="background:var(--accent)" onclick="menu()">▶️ Start</button>
  <div class="credit">Created by Rabia</div>
 </div>
 <div id="menu" class="hide">
  <div class="top"><button class="ic h" onclick="stop();show('cover')">🔙</button><span>👇</span></div>
  <div class="cats" id="cats"></div>
 </div>
 <div id="cat" class="hide">
  <div class="top"><button class="ic h" onclick="menu()">🔙</button><span><span id="ci"></span> <span id="cn"></span></span></div>
  <button class="big" style="background:var(--blue);margin-top:20px" onclick="startLearn()">👂 Learn<small>Listen and look</small></button>
  <button class="big" style="background:var(--accent)" onclick="startQuiz()">🎮 Play<small>Pick the right picture</small></button>
 </div>
 <div id="learn" class="hide">
  <div class="top"><span class="row" style="margin:0"><button class="ic h" onclick="pickCat(cat)">🔙</button><button class="ic h" onclick="menu()">🏠</button></span><span id="lp"></span></div>
  <div class="card"><div class="pic" id="lpic"></div><div class="word" id="lword"></div>
   <div class="row"><button class="ic" onclick="say(cur.w)">🔊</button></div></div>
  <div class="row"><button class="ic h" style="width:84px;height:84px" onclick="step(-1)">⬅️</button><button class="ic" id="ap" style="background:var(--accent)" onclick="toggleAuto()">▶️</button><button class="ic" onclick="step(1)">➡️</button></div>
 </div>
 <div id="quiz" class="hide">
  <div class="top"><span class="row" style="margin:0"><button class="ic h" onclick="pickCat(cat)">🔙</button><button class="ic h" onclick="menu()">🏠</button></span><span id="qs"></span></div>
  <div class="card" style="margin-bottom:12px"><div style="font-size:1.6rem">👂 Listen</div>
   <button class="ic" style="width:120px;height:120px;font-size:4rem;margin:8px 0" onclick="say(cur.w)">🔊</button></div>
  <div class="choices" id="chs"></div>
 </div>
 <div id="end" class="hide">
  <div class="pic" id="ei"></div><div id="es" style="font-size:2.2rem"></div>
  <div style="font-size:2rem;margin-top:10px">Thank you! 🙏</div>
  <div class="row"><button class="ic" onclick="again()">🔁</button><button class="ic h" style="width:84px;height:84px" onclick="menu()">📚</button></div>
  <div class="credit">Created by Rabia ❤️</div>
 </div>
</div>
